# ==========================================================
# 📱 대연초 야구부 명단 - 안드로이드 앱(APK) 자동 빌드
# ==========================================================
# - 실행 방법: 저장소 → Actions → "안드로이드 앱(APK) 빌드" → Run workflow
#   (이 파일을 수정해서 올려도 자동 실행됨)
# - 결과물: Releases 의 "android-app" 에 daeyeon-baseball.apk 가 올라감.
#   다운로드 주소(항상 최신): https://github.com/<저장소>/releases/latest/download/daeyeon-baseball.apk
# - 앱은 https://dybbr.github.io 를 그대로 보여주는 방식(TWA)이라,
#   사이트를 수정하면 앱에도 자동 반영됨 → 사이트만 고칠 때는 다시 빌드할 필요 없음.
# - 필요한 시크릿: ANDROID_KEYSTORE_PASSWORD (Settings → Secrets and variables → Actions)
# - 아래 서명키(keystore)는 비밀번호로 AES-256 암호화된 상태라 비밀번호 없이는 쓸 수 없음.
#   ⚠️ 이 키를 바꾸면 이미 설치된 앱이 업데이트되지 않고, assetlinks.json 도 다시 만들어야 하니 절대 바꾸지 말 것.
name: 안드로이드 앱(APK) 빌드

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'icons/icon-512.png'
      - 'icons/icon-maskable-512.png'

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

env:
  APP_ID: io.github.dybbr.roster   # 앱 고유 ID (assetlinks.json 과 같아야 함, 바꾸지 말 것)
  APP_NAME: 대연초 야구부
  SITE_HOST: dybbr.github.io   # 주소를 바꾸면 AndroidManifest 부분(DEFAULT_URL, host)도 같이 바꿀 것

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: Java 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 설치
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 시크릿 확인
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD 시크릿이 없습니다. Settings → Secrets and variables → Actions 에서 추가해 주세요."
            exit 1
          fi

